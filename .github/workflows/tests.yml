name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Verify entry points exist
        shell: bash
        run: |
          test -f configure.sh
          test -f install-agent.sh
          test -f bootstrap.sh
          test -f configure.ps1
          test -f install-agent.ps1
          test -f bootstrap.ps1
          test -f configure.cmd
          test -f install-agent.cmd
          test -f scripts/python-detect.ps1

  powershell:
    name: Windows / PowerShell entry points
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            "configure.ps1",
            "install-agent.ps1",
            "bootstrap.ps1",
            "scripts/python-detect.ps1"
          )
          $failed = 0
          foreach ($file in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$null, [ref]$errors
            ) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $failed++
              Write-Host "::error file=$file::$($errors[0].Message)"
              $errors | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed -gt 0) { exit 1 }

      - name: configure.ps1 lists agents
        shell: pwsh
        env:
          AGENT_BRIDGE_USER_HOME: ${{ runner.temp }}/ab-home
        run: |
          ./configure.ps1 --list-agents
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: configure.ps1 non-interactive dry run
        shell: pwsh
        env:
          AGENT_BRIDGE_USER_HOME: ${{ runner.temp }}/ab-home
        run: |
          ./configure.ps1 --non-interactive --provider metis --api-key sk-demo --agents all --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: install-agent.ps1 dry run
        shell: pwsh
        env:
          AGENT_BRIDGE_USER_HOME: ${{ runner.temp }}/ab-home
        run: |
          ./install-agent.ps1 --agents opencode-cli,pi --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: cmd.exe shim works
        shell: cmd
        run: |
          configure.cmd --version
          if errorlevel 1 exit /b 1
